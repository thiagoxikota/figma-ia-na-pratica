name: instalador
on:
  push:
  workflow_dispatch:
jobs:
  testa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Testes do instalador (com download real do plugin)
        run: node test/instalador.test.mjs --rede
      - name: O comando do guia, pelo npx, numa casa limpa
        shell: bash
        env:
          FIGMA_ACCESS_TOKEN: figd_TESTE_ci_npx
          INSTALAR_SEM_ABRIR: '1'
        run: |
          CASA="$RUNNER_TEMP/casa npx"
          mkdir -p "$CASA"
          export MCP_CONFIG_PATH="$CASA/cfg.json"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          if [ "$RUNNER_OS" = "Windows" ]; then NPX=npx.cmd; else NPX=npx; fi
          HOME="$CASA" USERPROFILE="$CASA" $NPX -y "$URL" < /dev/null
          test -f "$CASA/.figma-console-mcp/plugin/manifest.json"
          grep -q figma-console "$MCP_CONFIG_PATH"
          echo "npx OK"
      - name: Codex, numa casa limpa, abre o servidor com o bloco gravado
        shell: bash
        env:
          FIGMA_ACCESS_TOKEN: figd_TESTE_ci_codex
          INSTALAR_SEM_ABRIR: '1'
        run: |
          CASA="$RUNNER_TEMP/casa codex"
          mkdir -p "$CASA/.codex"
          export MCP_CONFIG_PATH="$CASA/cfg.json" CODEX_HOME="$CASA/.codex"
          HOME="$CASA" USERPROFILE="$CASA" node instalar.mjs --sem-plugin --codex < /dev/null || test $? -eq 3
          grep -q startup_timeout_sec "$CODEX_HOME/config.toml"
          npm install -g @openai/codex > /dev/null 2>&1
          codex mcp get figma-console
          node test/codex-handshake.mjs "$CODEX_HOME/config.toml"
